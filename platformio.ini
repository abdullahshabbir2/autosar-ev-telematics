; PlatformIO project configuration for the odometer ECU.
;
; Copyright (c) 2024-2026 Abdullah Shabbir. All rights reserved.
;
; Two environments:
;
;   [env:esp32doit-devkit-v1]  the target firmware.
;   [env:native]               a placeholder that documents how the host tests are actually run.
;
; The host tests are NOT run through PlatformIO. `tools/run_native_tests.py` compiles them with the system
; compiler directly, and that is deliberate: it links every `src/**/*.c` into each suite, so a platform
; dependency that leaks above the MCAL becomes an undefined-reference error rather than a code-review comment.
; PlatformIO's own test runner would satisfy those references from the framework and the leak would go unnoticed.
;
;     python tools/run_native_tests.py            # every suite
;     python tools/run_native_tests.py test_odo   # one suite

[platformio]
default_envs = esp32doit-devkit-v1

; ==================================================================================================
;  Shared settings
; ==================================================================================================

[common]
; Two include roots, and every project header is referenced by its layer-qualified path:
;
;     #include "mcal/Spi/Spi.h"
;     #include "services/Det/Det.h"
;     #include "Ecu_PinMap.h"          <- config/ only, where nothing collides
;
; This is not a style preference; a flat include path cannot be made to work on this platform.
;
; Windows and macOS have case-insensitive filesystems, and the AUTOSAR module names collide with framework
; headers when case is ignored: Spi.h/SPI.h, Can.h/can.h, Uart.h/uart.h, Adc.h/adc.h, Dio.h/dio.h. With
; src/mcal/Spi on a flat include path, the collision resolves differently depending on which -I directory comes
; first, and it resolves BOTH ways in the same build:
;
;   -I  ... our `#include "Spi.h"` finds the framework's SPI.h, so Spi_Lock is undeclared.
;   -iquote ... the framework's SD.h does `#include "SPI.h"` and finds OUR Spi.h, so SPIClass is undeclared.
;
; Qualifying by layer removes the ambiguity entirely -- no library has a `mcal/` directory -- and it buys
; something worth having on its own terms: a file's include list now states which layers it depends on, so a
; layer violation (an application file reaching into mcal/) is visible at a glance and greppable in CI.
;
; -iquote rather than -I so that a quoted include can only ever resolve inside this repository, and an
; angle-bracket include only ever outside it.
build_flags =
    -iquote src
    -iquote config

; ==================================================================================================
;  Target firmware
; ==================================================================================================

[env:esp32doit-devkit-v1]
platform = espressif32@3.3.0
platform_packages = framework-arduinoespressif32@3.10006.210326
board = esp32doit-devkit-v1
framework = arduino

board_build.partitions = partitions/odo_partitions.csv

build_flags =
    ${common.build_flags}
    ; -Wall -Wextra without -Werror. The Arduino core and the third-party libraries do not compile warning-free
    ; and never will, so -Werror here would fail the build on code this project does not own. The strict
    ; compilation that matters -- -Werror with -Wconversion, -Wsign-conversion, -Wshadow and the rest -- is
    ; applied to every platform-independent source by tools/run_native_tests.py, which is where the logic lives.
    -Wall
    -Wextra
    ; Double promotion is worth knowing about specifically: this firmware has no floating point in any
    ; calculation that matters, and an accidental double in a printf-family call on this part costs both code
    ; size and a surprising amount of time.
    -Wdouble-promotion
    ; CORE_DEBUG_LEVEL=1 (errors only). v1 built with 5 (verbose), which emits so much from the WiFi and lwIP
    ; drivers that this firmware's own Log output is unreadable in among it -- and the emission is synchronous on
    ; the calling task, so it also perturbs the timing being diagnosed.
    -DCORE_DEBUG_LEVEL=1

; No build_unflags. The core's -std=gnu++11 is left exactly as it is, and that is worth a note because the
; obvious-looking change here does not work: build_unflags applies to every source in the build, including the
; third-party libraries, and build_src_flags applies only to src/. Unflagging -std=gnu++11 to raise it for our
; own code therefore leaves PubSubClient and TinyGSM with no -std at all, so they fall back to C++98 and fail on
; std::function and nullptr. Nothing in this project needs a standard above C++11 -- the static assertions and
; nullptr both work there -- so there is nothing to gain by trying.

extra_scripts = pre:scripts/build_version.py

monitor_speed = 115200
monitor_filters = time, log2file, esp32_exception_decoder
upload_speed = 921600

debug_tool = esp-prog
debug_init_break = tbreak setup

lib_deps =
    ; MQTT. Chosen over the ESP-IDF client because it takes an Arduino Client reference, which is what lets one
    ; session run over either bearer -- see the comment at the top of NetIf_Esp32.cpp.
    knolleary/pubsubclient@^2.8
    ; SIM800L AT command handling. The one library in this list that is genuinely not worth reimplementing:
    ; see NetIf_Esp32.cpp for why the modem is the exception and the DS3231 is not.
    vshymanskyy/TinyGSM@^0.11.7
    ; Receive-only software UART for GNSS, because the ESP32's three hardware UARTs are all committed.
    plerup/EspSoftwareSerial@^8.0.1

; Libraries deliberately NOT used, with the reason, so that nobody re-adds one:
;
;   seeed-studio/CAN_BUS_Shield   The MCP2515 driver is src/mcal/Can/Can.c. The library drives chip select
;                                 itself, with no way to arbitrate against the SD card on the same bus -- which
;                                 is the defect this rewrite exists to fix. Being platform-free also makes the
;                                 identifier encoding and the register sequences host-testable.
;   mikalhart/TinyGPSPlus         The NMEA parser is src/ecuabs/GnssIf/GnssIf.c. C++ and Stream-coupled, so it
;                                 cannot be host-tested, and it returns coordinates as double where this project
;                                 uses degrees x 1e7 as integers throughout.
;   adafruit/RTClib               The DS3231 is four BCD registers, handled directly in TimeAbs_Esp32.cpp.
;                                 RTClib reports a missing device by returning 1 January 2000, which is
;                                 indistinguishable from a valid reading.
;   Firebase-ESP32-Client         Replaced by MQTT. The Firebase integration required a committed auth token,
;                                 and its REST calls allocated a String per record.
;   ESP Async WebServer           The on-device configuration web server is gone. It served an unauthenticated
;                                 page that could rewrite the odometer, and it ran on the same task as
;                                 acquisition. Configuration now arrives over the authenticated MQTT
;                                 diagnostic channel.
;   ESP32Ping, StreamDebugger     Diagnostic aids not needed in a shipping image.
;   ArduinoHttpClient             Only used by the Firebase path.

; ==================================================================================================
;  Host tests
; ==================================================================================================

[env:native]
; Present so `pio run -e native` fails with a clear pointer rather than a confusing compile error. The real
; runner is tools/run_native_tests.py -- see the comment at the top of this file for why.
platform = native
build_flags = -std=c11 -DUNIT_TEST=1
extra_scripts = pre:scripts/native_notice.py
