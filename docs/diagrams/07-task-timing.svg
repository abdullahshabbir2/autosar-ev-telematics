<?xml version="1.0" encoding="UTF-8"?>
<!--
  Task timing: four tasks, two cores, and where the budgets come from.
  Copyright (c) 2024-2026 Abdullah Shabbir. All rights reserved.

  Drawn to scale over one 3-second acquisition period. The whole point of the picture is that the tall
  bars are idle most of the time, and that the one task with a real deadline is the one protected from
  the two that can block for seconds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 916" width="1180" height="916"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size:21px; font-weight:bold; fill:#12121a; }
    .sub   { font-size:12px; fill:#54546a; }
    .tname { font-size:12.5px; font-weight:bold; fill:#12121a; }
    .step  { font-size:12.5px; fill:#12121a; font-weight:bold; }
    .small { font-size:10.5px; fill:#54546a; }
    .tick  { font-size:10px; fill:#54546a; }
    .mono  { font-size:10.5px; font-family:"DejaVu Sans Mono", Consolas, monospace; fill:#1e3a6e; }
    .lane  { fill:#f7f7fa; stroke:#c8c8d2; stroke-width:1; }
    .grid  { stroke:#dcdce4; stroke-width:1; }
    .axis  { stroke:#8a8a96; stroke-width:1.2; }
    .budget{ fill:none; stroke:#b3261e; stroke-width:1.4; stroke-dasharray:4 3; }
    .note  { font-size:11px; fill:#6a1b14; }
    .nbox  { fill:#fff8f7; stroke:#b3261e; stroke-width:1.1; rx:4; }
  </style>
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b33"/></marker>
    <!-- One mark per 10 ms tick, at the same scale as everything else: 3.0667 px of pitch. -->
    <pattern id="tickhatch" x="0" y="0" width="3.0667" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="16" fill="#4a2d7a"/>
    </pattern>
  </defs>

  <rect width="1180" height="916" fill="#ffffff"/>
  <text x="26" y="32" class="title">Task timing — one 3-second acquisition period, to scale</text>
  <text x="26" y="50" class="sub">Dashed red = the configured budget, beyond which SchM reports an overrun. Solid = expected typical execution — see the provenance note.</text>

  <!-- time axis: 0..3000 ms mapped to x 200..1120  (0.30667 px per ms) -->
  <g class="grid">
    <line x1="200" y1="80" x2="200" y2="600"/>
    <line x1="353" y1="80" x2="353" y2="600"/>
    <line x1="507" y1="80" x2="507" y2="600"/>
    <line x1="660" y1="80" x2="660" y2="600"/>
    <line x1="813" y1="80" x2="813" y2="600"/>
    <line x1="967" y1="80" x2="967" y2="600"/>
    <line x1="1120" y1="80" x2="1120" y2="600"/>
  </g>
  <line class="axis" x1="200" y1="600" x2="1120" y2="600"/>
  <text x="200" y="618" class="tick" text-anchor="middle">0</text>
  <text x="353" y="618" class="tick" text-anchor="middle">500</text>
  <text x="507" y="618" class="tick" text-anchor="middle">1000</text>
  <text x="660" y="618" class="tick" text-anchor="middle">1500</text>
  <text x="813" y="618" class="tick" text-anchor="middle">2000</text>
  <text x="967" y="618" class="tick" text-anchor="middle">2500</text>
  <text x="1120" y="618" class="tick" text-anchor="middle">3000 ms</text>
  <text x="660" y="636" class="small" text-anchor="middle">time within one acquisition period</text>

  <!-- ===================== lane 1: scheduler tick ===================== -->
  <text x="26" y="98" class="tname">SchM tick</text>
  <text x="26" y="114" class="small">10 ms · prio 5 · core 1</text>
  <text x="26" y="128" class="small">4 KiB stack</text>
  <text x="26" y="144" class="mono">budget 5 ms</text>
  <rect class="lane" x="200" y="86" width="920" height="60"/>
  <!-- 300 ticks across the period: drawn as a dense hatch, honestly at scale each is ~0.2 px -->
  <rect x="200" y="94" width="920" height="16" fill="url(#tickhatch)"/>
  <text x="200" y="126" class="small" fill="#4a2d7a">300 activations in this window, each well under 1 ms — the pitch above is to scale</text>
  <text x="200" y="140" class="small">CAN polling · Wdg_Trigger · WdgM_MainFunction · Det drain</text>

  <!-- ===================== lane 2: acquisition ===================== -->
  <text x="26" y="188" class="tname">Acquisition</text>
  <text x="26" y="204" class="small">3000 ms · prio 4 · core 1</text>
  <text x="26" y="218" class="small">6 KiB stack</text>
  <text x="26" y="234" class="mono">budget 2400 ms</text>
  <rect class="lane" x="200" y="176" width="920" height="84"/>
  <!-- clean RS485 round ~1300 ms -> 399 px -->
  <rect x="200" y="192" width="399" height="30" fill="#e8f0fb" stroke="#1e3a6e" stroke-width="1.5" rx="2"/>
  <text x="399" y="211" class="small" text-anchor="middle" fill="#1e3a6e">RS485: 4 packs × 2 objects — typical 1300 ms</text>
  <!-- with one retry ~1800 -> 552 px -->
  <rect x="599" y="192" width="154" height="30" fill="#fdf2e4" stroke="#8a5a14" stroke-width="1.2" rx="2" stroke-dasharray="4 3"/>
  <text x="676" y="211" class="small" text-anchor="middle" fill="#8a5a14">+1 retry</text>
  <rect class="budget" x="200" y="188" width="736" height="38"/>
  <text x="940" y="204" class="small" fill="#b3261e">budget ends 2400 ms</text>
  <text x="940" y="219" class="small">v1 took 13 s here</text>
  <text x="212" y="242" class="small">then Adc oversample, GnssIf parse, IoHwAb, OdoSwc, BattSwc — a few ms</text>
  <text x="212" y="256" class="small">idle for the remaining ~1.2 s, waiting out the period</text>

  <!-- ===================== lane 3: storage ===================== -->
  <text x="26" y="298" class="tname">Storage</text>
  <text x="26" y="314" class="small">3000 ms · prio 3 · core 1</text>
  <text x="26" y="328" class="small">8 KiB stack</text>
  <text x="26" y="344" class="mono">budget 2000 ms</text>
  <rect class="lane" x="200" y="286" width="920" height="84"/>
  <!-- runs after acquisition; typical 120 ms -> 37 px -->
  <rect x="601" y="302" width="37" height="30" fill="#e4f0e8" stroke="#1e5c33" stroke-width="1.5" rx="2" stroke-dasharray="3 3"/>
  <text x="648" y="314" class="small">one record append + fsync — typical duration not yet measured on hardware</text>
  <!-- worst case 2000 -> 613 px -->
  <rect class="budget" x="200" y="298" width="613" height="38"/>
  <text x="648" y="330" class="small">2000 ms budget, taken from an SD write reaching 2 s behind wear levelling</text>
  <text x="212" y="356" class="small">Lower priority than acquisition on purpose: a 2-second card write must never hold off a timed RS485 exchange.</text>
  <path stroke="#2b2b33" stroke-width="1.4" fill="none" marker-end="url(#t)" d="M599 222 C 599 260, 601 268, 601 298"/>
  <text x="612" y="272" class="small">record handed over, store before send</text>

  <!-- ===================== lane 4: connectivity ===================== -->
  <text x="26" y="408" class="tname">Connectivity</text>
  <text x="26" y="424" class="small">1000 ms · prio 2 · core 0</text>
  <text x="26" y="438" class="small">10 KiB stack</text>
  <text x="26" y="454" class="mono">budget 800 ms</text>
  <rect class="lane" x="200" y="396" width="920" height="84"/>
  <g fill="#f4f0fb" stroke="#4a2d7a" stroke-width="1.4">
    <rect x="200" y="412" width="18" height="30" rx="2"/>
    <rect x="507" y="412" width="18" height="30" rx="2"/>
    <rect x="813" y="412" width="18" height="30" rx="2"/>
  </g>
  <rect class="budget" x="200" y="408" width="245" height="38"/>
  <text x="452" y="426" class="small" fill="#b3261e">800 ms</text>
  <text x="200" y="460" class="small" fill="#4a2d7a">3 activations per acquisition period — ComM arbitration, NetIf pump, one backlog record published each time</text>
  <text x="200" y="474" class="small">On core 0 with the WiFi and lwIP stacks: cross-core lock contention stays away from the RS485 timing on core 1.</text>

  <!-- ===================== core separation ===================== -->
  <rect x="200" y="500" width="440" height="80" fill="#e8f0fb" stroke="#1e3a6e" stroke-width="1.5" rx="4"/>
  <text x="420" y="522" class="step" text-anchor="middle" fill="#1e3a6e">Core 1 — deterministic work</text>
  <text x="420" y="542" class="small" text-anchor="middle">SchM tick · Acquisition · Storage</text>
  <text x="420" y="560" class="small" text-anchor="middle">The RS485 half-duplex turnaround is the only real deadline in the ECU,</text>
  <text x="420" y="574" class="small" text-anchor="middle">and it lives here, away from the radio.</text>

  <rect x="680" y="500" width="440" height="80" fill="#f4f0fb" stroke="#4a2d7a" stroke-width="1.5" rx="4"/>
  <text x="900" y="522" class="step" text-anchor="middle" fill="#4a2d7a">Core 0 — the radio and everything it delays</text>
  <text x="900" y="542" class="small" text-anchor="middle">Connectivity · ESP-IDF WiFi driver · lwIP</text>
  <text x="900" y="560" class="small" text-anchor="middle">Everything this task sends is already durable on the card,</text>
  <text x="900" y="574" class="small" text-anchor="middle">so it is the one task that can afford to be late.</text>

  <!-- ===================== priority ladder ===================== -->
  <text x="26" y="678" class="step">Priority order, and what each one is protected from</text>
  <g class="small">
    <rect x="26" y="690" width="1128" height="1" fill="#dcdce4"/>
    <text x="40"  y="712" class="mono">5</text><text x="70" y="712" class="tname">SchM tick</text>
    <text x="220" y="712">Supervision must run even when everything else is late, or WdgM cannot tell "busy" from "stopped".</text>
    <text x="40"  y="734" class="mono">4</text><text x="70" y="734" class="tname">Acquisition</text>
    <text x="220" y="734">Preemption mid-exchange risks an RS485 turnaround violation, which costs the whole frame.</text>
    <text x="40"  y="756" class="mono">3</text><text x="70" y="756" class="tname">Storage</text>
    <text x="220" y="756">An SD write may block for seconds; it must not be able to hold off acquisition.</text>
    <text x="40"  y="778" class="mono">2</text><text x="70" y="778" class="tname">Connectivity</text>
    <text x="220" y="778">The most delay-tolerant: everything it sends is already persisted.</text>
  </g>

  <!-- ===================== note ===================== -->
  <rect class="nbox" x="26" y="796" width="1128" height="102"/>
  <text x="40" y="816" class="step" fill="#8a1e1e">Where these numbers come from</text>
  <text x="40" y="836" class="note">Periods, priorities, cores, stacks and budgets are all from `SchM_Cfg.h`, which carries `_Static_assert`s that each budget is below its period and that</text>
  <text x="40" y="852" class="note">the priority order above holds — so a widened budget or a reordered priority is a compile error, not a comment that stopped being true. The RS485 bar is</text>
  <text x="40" y="868" class="note">computed from the baud rate and frame sizes, not measured. Execution times on silicon await hardware bring-up; `SchM_GetTaskStats` reports observed</text>
  <text x="40" y="884" class="note">durations and stack high-water marks, which is how these bars get replaced with measurements rather than estimates.</text>
</svg>
