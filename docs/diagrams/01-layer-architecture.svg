<?xml version="1.0" encoding="UTF-8"?>
<!--
  Layer architecture.
  Copyright (c) 2024-2026 Abdullah Shabbir. All rights reserved.

  Hand-authored SVG rather than a rendered export: it diffs as text, opens in any browser without a
  plugin, and the module names can be kept in step with the tree by editing them here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" width="1180" height="820"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <style>
    .title    { font-size:21px; font-weight:bold; fill:#12121a; }
    .sub      { font-size:12px; fill:#54546a; }
    .layer    { font-size:15px; font-weight:bold; }
    .layersub { font-size:11px; font-style:italic; }
    .mod      { font-size:12.5px; fill:#12121a; }
    .note     { font-size:11px; fill:#54546a; }
    .rule     { font-size:11.5px; fill:#6a1b14; }
    .arrow    { stroke:#2b2b33; stroke-width:1.8; fill:none; marker-end:url(#tip); }
    .banned   { stroke:#b3261e; stroke-width:2; fill:none; marker-end:url(#tipred); }
    .modbox   { fill:#ffffff; stroke:#8a8a99; stroke-width:1; rx:3; }
    .hw       { fill:#f2e8e2; stroke:#8a4b1e; stroke-width:1.4; rx:3; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b33"/>
    </marker>
    <marker id="tipred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
  </defs>

  <rect width="1180" height="820" fill="#ffffff"/>
  <text x="26" y="32" class="title">Layer architecture</text>
  <text x="26" y="50" class="sub">AUTOSAR Classic layering. Calls go downward or sideways within a layer, never upward.</text>

  <!-- ======================= APPLICATION ======================= -->
  <rect x="26" y="70" width="900" height="96" fill="#e8f0fb" stroke="#1e3a6e" stroke-width="1.8" rx="4"/>
  <text x="40" y="92" class="layer" fill="#1e3a6e">Application — software components</text>
  <text x="40" y="108" class="layersub" fill="#1e3a6e">What the ECU is for. No hardware, no protocols, no persistence details.</text>
  <g>
    <rect class="modbox" x="40"  y="118" width="120" height="34"/><text x="100" y="139" class="mod" text-anchor="middle">OdoSwc</text>
    <rect class="modbox" x="172" y="118" width="120" height="34"/><text x="232" y="139" class="mod" text-anchor="middle">BattSwc</text>
    <rect class="modbox" x="304" y="118" width="130" height="34"/><text x="369" y="139" class="mod" text-anchor="middle">TelemSwc</text>
    <rect class="modbox" x="446" y="118" width="120" height="34"/><text x="506" y="139" class="mod" text-anchor="middle">DiagSwc</text>
    <rect class="modbox" x="578" y="118" width="120" height="34"/><text x="638" y="139" class="mod" text-anchor="middle">HmiSwc</text>
  </g>

  <!-- ======================= RTE / SCHEDULER ======================= -->
  <rect x="26" y="180" width="900" height="78" fill="#eae4f5" stroke="#4a2d7a" stroke-width="1.8" rx="4"/>
  <text x="40" y="202" class="layer" fill="#4a2d7a">RTE / Scheduler</text>
  <text x="40" y="218" class="layersub" fill="#4a2d7a">Hand-written, not generated — see ADR-0002. Owns every task body and the dispatch tables.</text>
  <rect class="modbox" x="40" y="226" width="120" height="26"/><text x="100" y="244" class="mod" text-anchor="middle">SchM</text>
  <text x="176" y="244" class="note">4 FreeRTOS tasks · pinned to cores · execution budgets · watchdog supervision</text>

  <!-- ======================= SERVICES ======================= -->
  <rect x="26" y="272" width="900" height="132" fill="#e4f0e8" stroke="#1e5c33" stroke-width="1.8" rx="4"/>
  <text x="40" y="294" class="layer" fill="#1e5c33">Services — basic software</text>
  <text x="40" y="310" class="layersub" fill="#1e5c33">Cross-cutting concerns. Each had an ad-hoc fragment in v1 and now has one home.</text>
  <g>
    <rect class="modbox" x="40"  y="320" width="86" height="30"/><text x="83"  y="340" class="mod" text-anchor="middle">EcuM</text>
    <rect class="modbox" x="136" y="320" width="76" height="30"/><text x="174" y="340" class="mod" text-anchor="middle">Det</text>
    <rect class="modbox" x="222" y="320" width="76" height="30"/><text x="260" y="340" class="mod" text-anchor="middle">Dem</text>
    <rect class="modbox" x="308" y="320" width="86" height="30"/><text x="351" y="340" class="mod" text-anchor="middle">WdgM</text>
    <rect class="modbox" x="404" y="320" width="76" height="30"/><text x="442" y="340" class="mod" text-anchor="middle">NvM</text>
    <rect class="modbox" x="490" y="320" width="76" height="30"/><text x="528" y="340" class="mod" text-anchor="middle">Fee</text>
    <rect class="modbox" x="576" y="320" width="76" height="30"/><text x="614" y="340" class="mod" text-anchor="middle">Crc</text>
    <rect class="modbox" x="40"  y="360" width="86" height="30"/><text x="83"  y="380" class="mod" text-anchor="middle">Com</text>
    <rect class="modbox" x="136" y="360" width="86" height="30"/><text x="179" y="380" class="mod" text-anchor="middle">ComM</text>
    <rect class="modbox" x="232" y="360" width="76" height="30"/><text x="270" y="380" class="mod" text-anchor="middle">Log</text>
  </g>
  <text x="330" y="380" class="note">MemIf and BswM deliberately omitted — ADR-0003</text>

  <!-- ======================= ECU ABSTRACTION ======================= -->
  <rect x="26" y="418" width="900" height="96" fill="#fdf2e4" stroke="#8a5a14" stroke-width="1.8" rx="4"/>
  <text x="40" y="440" class="layer" fill="#8a5a14">ECU abstraction</text>
  <text x="40" y="456" class="layersub" fill="#8a5a14">Protocols and devices, expressed in engineering units. Nothing above here sees a raw count.</text>
  <g>
    <rect class="modbox" x="40"  y="466" width="92" height="30"/><text x="86"  y="486" class="mod" text-anchor="middle">CanIf</text>
    <rect class="modbox" x="142" y="466" width="100" height="30"/><text x="192" y="486" class="mod" text-anchor="middle">Rs485If</text>
    <rect class="modbox" x="252" y="466" width="92" height="30"/><text x="298" y="486" class="mod" text-anchor="middle">GnssIf</text>
    <rect class="modbox" x="354" y="466" width="96" height="30"/><text x="402" y="486" class="mod" text-anchor="middle">IoHwAb</text>
    <rect class="modbox" x="460" y="466" width="100" height="30"/><text x="510" y="486" class="mod" text-anchor="middle">TimeAbs</text>
    <rect class="modbox" x="570" y="466" width="92" height="30"/><text x="616" y="486" class="mod" text-anchor="middle">FsAbs</text>
    <rect class="modbox" x="672" y="466" width="92" height="30"/><text x="718" y="486" class="mod" text-anchor="middle">NetIf</text>
  </g>

  <!-- ======================= MCAL ======================= -->
  <rect x="26" y="528" width="900" height="100" fill="#fbe8e6" stroke="#8a1e1e" stroke-width="2" rx="4"/>
  <text x="40" y="550" class="layer" fill="#8a1e1e">MCAL — microcontroller abstraction</text>
  <text x="40" y="566" class="layersub" fill="#8a1e1e">The only layer that touches hardware. Everything above it is host-testable because of that.</text>
  <g>
    <rect class="modbox" x="40"  y="576" width="72" height="30"/><text x="76"  y="596" class="mod" text-anchor="middle">Mcu</text>
    <rect class="modbox" x="122" y="576" width="72" height="30"/><text x="158" y="596" class="mod" text-anchor="middle">Port</text>
    <rect class="modbox" x="204" y="576" width="72" height="30"/><text x="240" y="596" class="mod" text-anchor="middle">Dio</text>
    <rect class="modbox" x="286" y="576" width="72" height="30"/><text x="322" y="596" class="mod" text-anchor="middle">Adc</text>
    <rect class="modbox" x="368" y="576" width="72" height="30"/><text x="404" y="596" class="mod" text-anchor="middle">Gpt</text>
    <rect class="modbox" x="450" y="576" width="72" height="30"/><text x="486" y="596" class="mod" text-anchor="middle">Spi</text>
    <rect class="modbox" x="532" y="576" width="72" height="30"/><text x="568" y="596" class="mod" text-anchor="middle">Uart</text>
    <rect class="modbox" x="614" y="576" width="72" height="30"/><text x="650" y="596" class="mod" text-anchor="middle">Can</text>
    <rect class="modbox" x="696" y="576" width="72" height="30"/><text x="732" y="596" class="mod" text-anchor="middle">Wdg</text>
    <rect class="modbox" x="778" y="576" width="72" height="30"/><text x="814" y="596" class="mod" text-anchor="middle">Fls</text>
  </g>

  <!-- ======================= HARDWARE ======================= -->
  <rect x="26" y="644" width="900" height="58" class="hw"/>
  <text x="40" y="666" class="layer" fill="#8a4b1e">Hardware</text>
  <text x="40" y="686" class="note">ESP32-WROOM-32 · MCP2515+TJA1050 · MAX3485 · NEO-6M · SIM800L · microSD · DS3231</text>

  <!-- ======================= downward arrows ======================= -->
  <path class="arrow" d="M480 166 V 180"/>
  <path class="arrow" d="M480 258 V 272"/>
  <path class="arrow" d="M480 404 V 418"/>
  <path class="arrow" d="M480 514 V 528"/>
  <path class="arrow" d="M480 628 V 644"/>

  <!-- ======================= the forbidden direction ======================= -->
  <path class="banned" d="M946 600 C 1000 600, 1000 140, 946 140"/>
  <text x="1010" y="360" class="rule" text-anchor="middle" transform="rotate(90 1010 360)">no upward calls</text>

  <!-- ======================= rules panel ======================= -->
  <rect x="26" y="716" width="1128" height="86" fill="#fff8f7" stroke="#b3261e" stroke-width="1.2" rx="4"/>
  <text x="38" y="736" class="layer" fill="#8a1e1e" font-size="13">Two deliberate exceptions to strict layering</text>
  <text x="38" y="756" class="rule">1. MCAL may call Det. A driver that detects a contract violation and cannot report it must either ignore it or invent a return</text>
  <text x="38" y="772" class="rule">   path the caller cannot act on. AUTOSAR permits this, and Det has no dependencies of its own.</text>
  <text x="38" y="792" class="rule">2. ECU abstraction may call Dem, Crc and Log. Routing a diagnostic event up through the RTE and back down would add indirection whose only purpose is satisfying the diagram.</text>
</svg>
